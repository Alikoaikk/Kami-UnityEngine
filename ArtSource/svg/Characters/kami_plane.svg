    <!-- headband streamers -->
    <path d="M32,38 C20,30 12,30 2,34 L9,43 C17,41 24,42 32,46 Z" fill="#A32D2D" stroke-width="4"/>
    <path d="M33,45 C25,52 17,58 10,67 L20,67 C24,61 29,56 34,52 Z" fill="#A32D2D" stroke-width="4"/>
    <!-- far wing -->
    <path d="M28,34 L84,62 L60,56 Z" fill="#DCD1BD" stroke-width="3"/>
    <!-- keel -->
    <path d="M84,62 L228,58 L76,86 Z" fill="#EDE5D6" stroke-width="5"/>
    <!-- near wing -->
    <path d="M28,34 L228,58 L84,62 Z" fill="#FFFFFF" stroke-width="5"/>
    <path d="M40,40 L210,58" fill="none" stroke-width="2"/>
  </g>
