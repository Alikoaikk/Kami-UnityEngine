<svg xmlns="http://www.w3.org/2000/svg" width="200" height="170" viewBox="0 0 200 170">
  <!-- Kami, boat form. Faces right. Pivot: bottom centre (waterline is ~1/3 up). -->
  <g stroke="#2C2C2A" stroke-linejoin="round" stroke-linecap="round">
    <!-- headband tails off the mast tip -->
    <path d="M100,14 C84,6 70,6 56,10 L64,19 C75,19 87,20 100,23 Z" fill="#A32D2D" stroke-width="4"/>
    <path d="M100,20 C88,26 78,34 70,45 L80,47 C86,39 94,31 101,28 Z" fill="#A32D2D" stroke-width="4"/>
    <!-- sail -->
    <path d="M100,10 L60,112 L140,112 Z" fill="#FFFFFF" stroke="none"/>
    <path d="M100,10 L100,112 L140,112 Z" fill="#EDE5D6" stroke="none"/>
    <path d="M100,10 L100,112" fill="none" stroke-width="2.5"/>
    <path d="M100,10 L60,112 L140,112 Z" fill="none" stroke-width="5"/>
    <!-- hull -->
    <path d="M16,112 L184,112 L152,166 L48,166 Z" fill="#FFFFFF" stroke="none"/>
    <path d="M34,140 L166,140 L152,166 L48,166 Z" fill="#EDE5D6" stroke="none"/>
    <path d="M34,140 L166,140" fill="none" stroke-width="2.5"/>
    <path d="M60,112 L72,140 M140,112 L128,140" fill="none" stroke-width="2.5"/>
    <path d="M16,112 L184,112 L152,166 L48,166 Z" fill="none" stroke-width="5"/>
    <circle cx="100" cy="15" r="6" fill="#A32D2D" stroke-width="3.5"/>
  </g>
</svg>
