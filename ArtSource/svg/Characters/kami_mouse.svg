<svg xmlns="http://www.w3.org/2000/svg" width="156" height="104" viewBox="0 0 156 104">
  <!-- Kami, mouse form. Faces right. Fits a 1-tile tunnel. Pivot: bottom centre. -->
  <g stroke="#2C2C2A" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M30,92 C12,90 4,74 12,63 C18,56 27,60 23,68" fill="none" stroke-width="4"/>
    <!-- feet -->
    <ellipse cx="62" cy="98" rx="8" ry="5" fill="#2C2C2A" stroke="none"/>
    <ellipse cx="114" cy="98" rx="8" ry="5" fill="#2C2C2A" stroke="none"/>
    <!-- body -->
    <path d="M26,96 L48,52 L90,38 L144,90 L138,96 Z" fill="#FFFFFF" stroke="none"/>
    <path d="M26,96 L48,52 L72,96 Z" fill="#EDE5D6" stroke="none"/>
    <path d="M48,52 L72,96 M90,38 L82,96" fill="none" stroke-width="2.5"/>
    <path d="M26,96 L48,52 L90,38 L144,90 L138,96 Z" fill="none" stroke-width="5"/>
    <!-- headband tails, tied behind the ear -->
    <path d="M90,30 C78,20 64,18 50,22 L57,32 C67,30 78,32 88,38 Z" fill="#A32D2D" stroke-width="3.5"/>
    <path d="M90,37 C80,38 70,42 62,48 L70,54 C76,49 83,46 91,45 Z" fill="#A32D2D" stroke-width="3.5"/>
    <!-- ear -->
    <path d="M84,46 L94,12 L116,52 Z" fill="#FFFFFF" stroke-width="4.5"/>
    <path d="M91,42 L95,26 L106,47 Z" fill="#EDE5D6" stroke="none"/>
    <!-- face -->
    <circle cx="121" cy="70" r="4.5" fill="#2C2C2A" stroke="none"/>
    <circle cx="145" cy="91" r="4.5" fill="#2C2C2A" stroke="none"/>
    <path d="M134,82 L150,76 M134,87 L152,86" fill="none" stroke-width="2"/>
  </g>
</svg>
